<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caesar Games — Love &amp; Play</title>
<meta name="description" content="Caesar Games — Junqi, Xiangqi, Chess and Gomoku in one quiet bilingual tabletop collection.">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Caesar Games">
<meta name="theme-color" content="#12243F">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icon-180.png">
<link rel="apple-touch-icon" sizes="167x167" href="assets/icon-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="assets/icon-152.png">
<link rel="apple-touch-icon" sizes="120x120" href="assets/icon-120.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
<link rel="manifest" href="manifest.json">

<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/board.css">
</head>
<body>

<header id="app-bar" data-context="home">
  <button id="brand" class="brand" type="button" aria-label="Caesar Games home">
    <img src="assets/cd_home_mark_transparent.png" alt="" class="brand-mark">
    <span class="brand-text">
      <span class="brand-name" data-i18n="brand.name">Caesar Games</span>
      <span class="brand-tagline" data-i18n="brand.tagline">Love &amp; Play</span>
    </span>
  </button>

  <div class="bar-right">
    <span id="mode-tag" class="mode-tag"></span>
    <span id="network-status" class="network-status is-hidden" data-i18n="pwa.offline">Offline</span>
    <button id="btn-language" class="bar-btn language-btn" type="button" aria-label="Switch language">中文</button>
    <button id="btn-sound" class="bar-btn" type="button" aria-pressed="true">
      <span class="btn-icon" aria-hidden="true"></span>
      <span class="btn-label" data-i18n="bar.soundOn">Sound on</span>
    </button>
    <button id="btn-home" class="bar-btn is-hidden" type="button">
      <span class="btn-label" data-i18n="bar.home">Home</span>
    </button>
  </div>
</header>

<!-- ============================ HOME ============================ -->
<main class="screen is-active" data-screen="home">
  <div class="home">
    <img src="assets/cd_home_mark_transparent.png" alt="" class="home-mark">
    <h1 class="home-title" data-i18n="brand.name">Caesar Games</h1>
    <p class="home-tagline" data-i18n="brand.tagline">Love &amp; Play</p>

    <div class="game-shelf" aria-label="Games">
      <button id="btn-play" class="game-tile" type="button" data-game-type="junqi">
        <span class="game-native" data-i18n="game.junqi.native">陆战棋</span>
        <span class="game-english" data-i18n="game.junqi.title">Junqi</span>
        <span class="game-desc" data-i18n="game.junqi.desc">Hidden information · strategy</span>
      </button>
      <button id="btn-xiangqi" class="game-tile" type="button" data-game-type="xiangqi">
        <span class="game-native" data-i18n="game.xiangqi.native">中国象棋</span>
        <span class="game-english" data-i18n="game.xiangqi.title">Xiangqi</span>
        <span class="game-desc" data-i18n="game.xiangqi.desc">Classic Chinese strategy</span>
      </button>
      <button id="btn-chess" class="game-tile" type="button" data-game-type="chess">
        <span class="game-native" data-i18n="game.chess.native">国际象棋</span>
        <span class="game-english" data-i18n="game.chess.title">Chess</span>
        <span class="game-desc" data-i18n="game.chess.desc">Classic world strategy</span>
      </button>
      <button id="btn-gomoku" class="game-tile" type="button" data-game-type="gomoku">
        <span class="game-native" data-i18n="game.gomoku.native">五子棋</span>
        <span class="game-english" data-i18n="game.gomoku.title">Gomoku</span>
        <span class="game-desc" data-i18n="game.gomoku.desc">Five in a row · calm tactics</span>
      </button>
    </div>

    <div class="home-actions">
      <button id="btn-continue" class="btn btn-continue is-hidden" type="button">
        <span data-i18n="home.continue">Continue</span>
        <small id="continue-detail"></small>
      </button>
      <div class="home-actions-quiet">
        <button id="btn-games" class="btn btn-quiet" type="button" data-i18n="home.games">Games</button>
        <button id="btn-learn" class="btn btn-quiet" type="button" data-i18n="home.learn">Learn</button>
      </div>
    </div>

    <p id="home-memory" class="home-memory is-hidden"></p>
  </div>

  <footer class="makers-mark">
    <span data-i18n="brand.mark">Caesar Games · Love &amp; Play · Since 2026</span> · <span id="build-tag"></span>
  </footer>
</main>

<!-- ============================ BOARD ============================ -->
<main class="screen" data-screen="board">
  <div class="table">
    <aside class="rail rail-left">
      <div class="turn-card">
        <span id="turn-dot" class="turn-dot side-navy"></span>
        <p id="turn-status" class="turn-status"></p>
      </div>
      <p id="board-hint" class="board-hint"></p>
    </aside>

    <div id="board-mount" class="board-mount"></div>

    <aside class="rail rail-right">
      <div id="setup-controls" class="control-stack is-hidden">
        <button id="btn-quick-setup" class="btn btn-quiet" type="button" data-i18n="setup.quick">Quick setup</button>
        <button id="btn-reset-setup" class="btn btn-quiet" type="button" data-i18n="setup.reset">Reset</button>
        <button id="btn-ready" class="btn btn-primary" type="button" data-i18n="setup.ready">Ready</button>
      </div>
      <div id="play-controls" class="control-stack is-hidden">
        <p id="move-counter" class="move-counter"></p>
        <button id="btn-replay-move" class="btn btn-quiet is-hidden" type="button" data-i18n="play.replayMove">Replay last move</button>
      </div>
    </aside>
  </div>

  <!-- Game end -->
  <div id="game-end" class="overlay">
    <div class="overlay-card end-card">
      <p class="end-eyebrow" data-i18n="end.eyebrow">Result</p>
      <h2 id="end-winner"></h2>
      <p id="end-detail" class="end-detail"></p>
      <p id="end-reason" class="end-reason"></p>
      <p id="end-memory" class="family-memory"></p>
      <div class="end-actions">
        <button id="btn-end-again" class="btn btn-primary" type="button" data-i18n="end.again">Play again</button>
        <button id="btn-end-record" class="btn btn-quiet" type="button" data-i18n="end.record">View record</button>
        <button id="btn-end-home" class="btn btn-quiet" type="button" data-i18n="end.home">Home</button>
      </div>
    </div>
  </div>
</main>

<!-- ============================ LEARN ============================ -->
<main class="screen" data-screen="learn">
  <div class="learn">
    <div class="learn-head">
      <h2 id="learn-title"></h2>
      <button id="btn-learn-back" class="btn btn-quiet" type="button" data-i18n="record.back">Back</button>
    </div>

    <div id="learn-grid" class="learn-grid"></div>

    <p class="learn-foot"><span data-i18n="brand.mark">Caesar Games · Love &amp; Play · Since 2026</span> · <span id="learn-build"></span></p>
  </div>
</main>

<!-- ============================ DIALOGS ============================ -->
<div class="dialog" data-dialog="mode">
  <div class="dialog-card">
    <header class="dialog-head">
      <h2 id="mode-title" data-i18n="mode.title">Choose a mode</h2>
      <button id="btn-close-mode" class="icon-btn" type="button" aria-label="Close" data-i18n-label="misc.close">✕</button>
    </header>
    <div class="mode-grid">
      <button class="mode-card" data-mode="vs_computer" type="button">
        <h3 data-i18n="mode.vsComputer">Vs Computer</h3>
        <p data-i18n="mode.vsComputer.desc">Play on your own against the iPad.</p>
      </button>
      <button id="mode-two-player" class="mode-card" data-mode="classic" type="button">
        <h3 data-i18n="mode.classic">2 Players · Classic</h3>
        <p data-i18n="mode.classic.desc">Hidden armies. Pass the iPad between turns.</p>
      </button>
      <button id="mode-flip" class="mode-card" data-mode="flip" type="button">
        <h3 data-i18n="mode.flip">2 Players · Flip</h3>
        <p data-i18n="mode.flip.desc">Face-down pieces. Start straight away.</p>
      </button>
    </div>
  </div>
</div>

<div class="dialog" data-dialog="names">
  <div class="dialog-card">
    <header class="dialog-head">
      <div>
        <h2 id="names-title">Players</h2>
        <p id="names-sub" class="dialog-sub"></p>
      </div>
      <button id="btn-close-names" class="icon-btn" type="button" aria-label="Back" data-i18n-label="record.back">✕</button>
    </header>

    <div class="field-list">
      <label class="field" id="field-p1">
        <span data-i18n="players.p1">Player 1</span>
        <input id="input-p1" type="text" maxlength="16" autocomplete="off" spellcheck="false">
      </label>
      <label class="field" id="field-p2">
        <span data-i18n="players.p2">Player 2</span>
        <input id="input-p2" type="text" maxlength="16" autocomplete="off" spellcheck="false">
      </label>
      <div class="field" id="field-difficulty">
        <span data-i18n="players.computerLabel">Computer</span>
        <div class="choice-row">
          <button class="choice" data-value="relaxed" type="button" data-i18n="players.relaxed">Relaxed</button>
          <button class="choice is-selected" data-value="standard" type="button" data-i18n="players.standard">Standard</button>
        </div>
      </div>
      <div class="field is-hidden" id="field-side">
        <span data-i18n="players.side">Your side</span>
        <div class="choice-row">
          <button class="choice is-selected" data-side="first" type="button"></button>
          <button class="choice" data-side="second" type="button"></button>
        </div>
      </div>
    </div>

    <div class="dialog-actions">
      <button id="btn-start-match" class="btn btn-primary" type="button" data-i18n="players.start">Start</button>
    </div>
  </div>
</div>

<div class="dialog" data-dialog="library">
  <div class="dialog-card wide">
    <header class="dialog-head">
      <h2 data-i18n="library.title">Games</h2>
      <button id="btn-close-library" class="icon-btn" type="button" aria-label="Close" data-i18n-label="misc.close">✕</button>
    </header>
    <div id="library-list" class="library-list"></div>
  </div>
</div>

<div class="dialog" data-dialog="record">
  <div class="dialog-card wide record-dialog">
    <header class="dialog-head">
      <div>
        <h2 id="record-title">Record</h2>
        <p id="record-meta" class="dialog-sub"></p>
        <p id="record-memory" class="family-memory is-hidden"></p>
      </div>
      <button id="btn-close-record" class="icon-btn" type="button" aria-label="Close" data-i18n-label="misc.close">✕</button>
    </header>
    <div class="record-body">
      <div id="replay-board" class="replay-board"></div>
      <div class="record-side">
        <div class="replay-bar">
          <button id="btn-replay-prev" class="row-btn quiet" type="button" data-i18n="record.back">Back</button>
          <button id="btn-replay-play" class="row-btn primary" type="button">Play</button>
          <button id="btn-replay-next" class="row-btn quiet" type="button" data-i18n="record.forward">Forward</button>
          <span id="replay-step" class="replay-step"></span>
        </div>
        <div id="record-moves" class="record-moves"></div>
      </div>
    </div>
  </div>
</div>

<!-- ============================ SHIELD & OVERLAYS ============================ -->
<div id="handoff" class="handoff">
  <div class="handoff-card">
    <img src="assets/cd_home_mark_transparent.png" alt="" class="handoff-mark">
    <p id="handoff-title" class="handoff-eyebrow">Pass the iPad</p>
    <h2 id="handoff-name"></h2>
    <p id="handoff-action" class="handoff-action"></p>
    <button id="btn-handoff-ready" class="btn btn-primary" type="button" data-i18n="handoff.ready">I'm ready</button>
  </div>
</div>

<div id="confirm" class="overlay">
  <div class="overlay-card">
    <h2 data-i18n="library.deleteTitle">Delete game</h2>
    <p id="confirm-text" class="end-detail"></p>
    <div class="end-actions">
      <button id="btn-confirm-ok" class="btn btn-danger" type="button" data-i18n="library.deleteConfirm">Delete</button>
      <button id="btn-confirm-cancel" class="btn btn-quiet" type="button" data-i18n="library.deleteCancel">Keep</button>
    </div>
  </div>
</div>

<div id="promotion" class="overlay">
  <div class="overlay-card">
    <p class="end-eyebrow" data-i18n="chess.promotion">Promotion</p>
    <h2 data-i18n="chess.choosePromotion">Choose a piece</h2>
    <div class="choice-row promotion-choices">
      <button class="choice" data-promotion="q" type="button" data-i18n="chess.queen">Queen</button>
      <button class="choice" data-promotion="r" type="button" data-i18n="chess.rook">Rook</button>
      <button class="choice" data-promotion="b" type="button" data-i18n="chess.bishop">Bishop</button>
      <button class="choice" data-promotion="n" type="button" data-i18n="chess.knight">Knight</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
<script type="module" src="js/pwa.js"></script>
</body>
</html>
